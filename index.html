<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptForge Studio</title>
    <meta name="description" content="A multi-agent writing studio with live LLM orchestration and trace visualization." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Multi-Agent Writing Lab</p>
          <h1>PromptForge Studio ✨</h1>
        </div>
        <div class="topbar-actions">
          <button id="themeToggle" class="ghost-button" type="button" aria-label="Toggle light dark theme">
            🌙 Theme
          </button>
          <button id="runAgents" class="primary-button" type="button">
            🚀 Run Writing Crew
          </button>
        </div>
      </header>

      <main class="dashboard">
        <aside class="panel left-panel">
          <section class="card">
            <div class="section-heading">
              <h2>🧠 Prompt</h2>
            </div>
            <textarea id="promptInput" rows="8" placeholder="Write a magical bedtime story about a robot who learns kindness..."></textarea>
            <div class="preset-row">
              <button class="chip-button" data-preset="story" type="button">Story</button>
              <button class="chip-button" data-preset="blog" type="button">Blog</button>
              <button class="chip-button" data-preset="email" type="button">Email</button>
            </div>
          </section>

          <section class="card settings-card">
            <div class="section-heading">
              <h2>⚙️ LLM Settings</h2>
            </div>
            <label>
              Live LLM Base URL
              <input id="apiBaseInput" type="text" value="https://api-inference.huggingface.co/models" />
            </label>
            <label>
              Model
              <input id="modelInput" type="text" value="google/flan-t5-small" />
            </label>
            <div class="toggle-stack" id="agentToggles"></div>
          </section>
        </aside>

        <section class="panel center-panel">
          <div class="card result-card">
            <div class="section-heading">
              <h2>📄 Final Output</h2>
              <span id="statusBadge" class="status-badge idle">Idle</span>
            </div>
            <div id="finalOutput" class="final-output">
              Your polished writing will appear here after the agents collaborate.
            </div>
          </div>
        </section>

        <aside class="panel right-panel">
          <div class="card trace-card">
            <div class="section-heading">
              <h2>🧭 Agent Trace</h2>
              <button id="clearTrace" class="ghost-button small" type="button">Clear</button>
            </div>
            <div id="traceList" class="trace-list" aria-live="polite"></div>
          </div>
        </aside>
      </main>
    </div>

    <template id="traceTemplate">
      <article class="trace-item">
        <div class="trace-header">
          <span class="trace-badge"></span>
          <h3 class="trace-name"></h3>
          <span class="trace-role"></span>
        </div>
        <p class="trace-instruction"></p>
        <div class="trace-result"></div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
